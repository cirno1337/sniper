<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Przekierowanie...</title>
    <script>
      // SPA fallback dla GitHub Pages (statyczny hosting bez server-side rewrite):
      // koduje ścieżkę w query string i przekierowuje na index.html, który ją odkoduje.
      var pathSegmentsToKeep = 1; // "/sniper"
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
